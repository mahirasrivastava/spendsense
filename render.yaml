# Render blueprint for SpendSense.
#
# Deploy: render.com -> New -> Blueprint -> pick this repo.
# Render provisions BOTH the web service and the Postgres database, and injects
# DATABASE_URL into the service automatically, so there is nothing to copy by hand.

databases:
  - name: spendsense-db
    databaseName: spendsense
    user: spendsense
    plan: free

services:
  - type: web
    name: spendsense
    runtime: node
    plan: free
    region: singapore          # closest to India; change if you prefer
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spendsense-db
          property: connectionString
